name: Newest Solid 2

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - run: node scripts/use-newest-solid.mjs
      - run: vp install --no-frozen-lockfile
      - run: vp exec playwright install --with-deps chromium firefox webkit
      - run: vp run verify
        env:
          SOLIX_PRIVATE_TERMS: ${{ secrets.SOLIX_PRIVATE_TERMS }}
