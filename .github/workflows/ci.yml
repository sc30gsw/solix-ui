name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true
      - run: vp exec playwright install --with-deps chromium firefox webkit
      - run: vp run verify
        env:
          SOLIX_PRIVATE_TERMS: ${{ secrets.SOLIX_PRIVATE_TERMS }}

  diagnose-scroll-anchoring:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true
      - run: vp exec playwright install --with-deps chromium firefox webkit
      - run: NODE_ENV=production vp run -r build
      - run: |
          (cd apps/playground && PORT=4400 HOST=127.0.0.1 node dist/server/node.js > /tmp/server.log 2>&1 &)
          sleep 3
          node scripts/diagnose-scroll-anchoring.mjs firefox http://127.0.0.1:4400/ 4
          DIAG_INSTRUMENT=1 node scripts/diagnose-scroll-anchoring.mjs firefox http://127.0.0.1:4400/ 3
      - run: |
          for run in 1 2; do vp test --project node apps/playground/tests/behaviour-seam.test.ts || true; done

  evidence:
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true
      - run: vp exec playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: vp run evidence
      - run: node scripts/publish-evidence.mjs
