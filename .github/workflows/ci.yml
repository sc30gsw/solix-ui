name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  newest-releases:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true
      - run: node scripts/check-newest-releases.ts

  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true
      - run: vp exec playwright install --with-deps chromium firefox webkit
      - run: vp run verify
        env:
          SOLIX_PRIVATE_TERMS: ${{ secrets.SOLIX_PRIVATE_TERMS }}
      - name: Upload the Storybook static build that verify made
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: apps/storybook/dist
          if-no-files-found: error
          retention-days: 14
