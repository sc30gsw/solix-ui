name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true
      - run: vp exec playwright install --with-deps chromium firefox webkit
      - run: vp run verify
        env:
          SOLIX_PRIVATE_TERMS: ${{ secrets.SOLIX_PRIVATE_TERMS }}

  evidence:
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - id: ffmpeg
        background: true
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true
      - name: Wait for ffmpeg, which holds the apt lock that the browser dependencies need
        wait: ffmpeg
      - run: vp exec playwright install --with-deps chromium firefox webkit
      - run: vp run evidence
      - run: node scripts/publish-evidence.mjs
