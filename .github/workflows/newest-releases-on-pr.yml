name: Newest releases on a pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  newest-releases:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true
      - run: node scripts/check-newest-releases.ts
