name: Storybook spike

on:
  push:
    branches: [cursor/storybook-spike-*]

permissions:
  contents: read

jobs:
  stories:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true
      - run: vp exec playwright install --with-deps chromium firefox webkit
      - run: vp run -r build
      - name: Stories pass in every engine
        working-directory: apps/storybook
        run: vp test run
      - name: Each broken story fails in every engine
        working-directory: apps/storybook
        env:
          SPIKE_BREAKS: "1"
        run: |
          status=0
          for engine in chromium firefox webkit; do
            for case in "Axe Violation=button-name" "Target Too Small=target-size" "Play Fails=toHaveTextContent" "Solid Warning=NO_OWNER_EFFECT" "Solid Diagnostic=REACTIVE_WRITE_IN_OWNED_SCOPE"; do
              story="${case%%=*}"
              reason="${case#*=}"
              SPIKE_ENGINE=$engine vp test run -t "^$story\$" > run.log 2>&1 && passed=1 || passed=0
              text=$(sed 's/\x1b\[[0-9;]*m//g' run.log)
              if [ $passed = 0 ] && grep -Eq "Tests +1 failed" <<<"$text" && grep -q -- "$reason" <<<"$text"; then
                echo "ok   $engine $story fails with $reason"
              else
                echo "MISS $engine $story"; cat run.log; status=1
              fi
            done
          done
          exit $status
      - name: Static build
        working-directory: apps/storybook
        run: vp exec storybook build -o storybook-static
