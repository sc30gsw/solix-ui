name: Pull request

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  text:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true
      - run: node scripts/check-pull-request-text.ts "$GITHUB_EVENT_PATH"
        env:
          SOLIX_PRIVATE_TERMS: ${{ secrets.SOLIX_PRIVATE_TERMS }}
